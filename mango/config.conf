exec-once=/usr/lib/xdg-desktop-portal-wlr
exec-once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once=remap
exec-once=xremap --device /dev/input/event6,/dev/input/event8,razer-fn-keys /home/ibro/.config/xremap/config.yml
exec-once=udiskie -sna
exec-once=playerctld daemon
exec-once=dms run

# More option see https://github.com/DreamMaoMao/mango/wiki/
# Window effect
blur=1
blur_layer=1
blur_optimized=0
blur_params_num_passes = 3
blur_params_radius = 9
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 1
layer_shadows = 1
shadow_only_floating = 1
shadows_size = 4
shadows_blur = 8
shadows_position_x = 0
shadows_position_y = 0
shadowscolor= 0x000000ff

border_radius=1
no_radius_when_single=1
focused_opacity=1.0
unfocused_opacity=1.0

windowrule=isfloating:1,width:1000,height:500,appid:fzf-kak
windowrule=isfloating:1,,appid:fzf-kak

# windowrule=isfloating:1,title:"Yazi Chooser"
# windowrule=isfloating:1,title:"^Picture-in-Picture$"
windowrule=isfloating:1,offsetx:52,offsety:35,appid:org.twosheds.iwgtk
# windowrule=isfloating:1,title:"^Picture-in-Picture$"
# windowrule=isfloating:1,title:"Picture in picture"

# Animation Configuration
# tag_animation_direction: 0-horizontal,1-vertical
animations=0
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.3
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=60
animation_duration_open=60
animation_duration_tag=1
animation_duration_close=60
animation_curve_open=0.08,1.0,0.29,1
animation_curve_move=0.08,1.0,0.29,1
animation_curve_tag=0.08,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.3
scroller_focus_center=0
scroller_prefer_center=1
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.33,0.5,0.66

# Master-Stack Layout Setting
new_is_master=1
default_mfact=0.55
default_nmaster=1
smartgaps=0

# Overview Setting
hotarea_size=10
enable_hotarea=1
ov_tab_mode=0
overviewgappi=5
overviewgappo=30

# Misc
no_border_when_single=1
axis_bind_apply_timeout=100
focus_on_activate=1
# inhibit_regardless_of_visibility not supported
sloppyfocus=0
warpcursor=0
focus_cross_monitor=0
focus_cross_tag=1
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1

# keyboard
repeat_rate=50
repeat_delay=300
numlockon=1
xkb_rules_layout=us

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
trackpad_accel_speed=0.3
trackpad_accel_profile=2 # adaptive
trackpad_accel_profile=2 # adaptive
trackpad_natural_scrolling=1
drag_lock=0
disable_while_typing=1
left_handed=0
middle_button_emulation=1
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Appearance
gappih=5
gappiv=5
gappoh=10
gappov=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=1
rootcolor=0x111111ff
bordercolor=0x201f2fff
focuscolor=0xc4a7e7ff
maximizescreencolor=0x89aa61ff
urgentcolor=0xad401fff
scratchpadcolor=0x516c93ff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tagrule=id:1,layout_name:scroller
tagrule=id:2,layout_name:scroller
tagrule=id:3,layout_name:scroller
tagrule=id:4,layout_name:scroller
tagrule=id:5,layout_name:scroller
tagrule=id:6,layout_name:scroller
tagrule=id:7,layout_name:scroller
tagrule=id:8,layout_name:scroller
tagrule=id:9,layout_name:scroller

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER+SHIFT,r,reload_config

# spawn apps (niri: Mod+Return/B/E)
bind=SUPER,Return,spawn,foot
bind=SUPER,b,spawn,zen-browser
bind=SUPER,e,spawn,dolphin

# launcher (keep Alt+Space for quick access)
bind=SUPER,space,spawn,vicinae toggle

# close window (niri: Mod+Q)
bind=SUPER,q,killclient

# quit (niri: Mod+Escape, but SUPER+Shift+Q is cleaner here)
bind=SUPER+Shift,q,quit

# resize column (niri: Mod+Minus/Equal)
bind=SUPER+ALT,1,set_proportion,0.33
bind=SUPER+ALT,2,set_proportion,0.50
bind=SUPER+ALT,3,set_proportion,0.66

# maximize / fullscreen (niri: Mod+F / Mod+Shift+F)
bind=SUPER,f,togglemaximizescreen
bind=SUPER+SHIFT,f,togglefullscreen
bind=ALT+SHIFT,f,togglefakefullscreen

bind=SUPER,m,togglefloating

# toggle overlay/tabbed (niri: Mod+I)
bind=SUPER,i,minimized
bind=SUPER,z,toggle_scratchpad

# overview
# bind=ALT,Tab,toggleoverview,

# window status
bind=SUPER,g,toggleglobal,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized

# scroller layout (niri: Mod+R for preset width)
bind=SUPER,r,switch_proportion_preset,
bind=SUPER,comma,scroller_stack,left
bind=SUPER,period,scroller_stack,right

# switch layout
bind=SUPER,n,switch_layout

# focus stack (niri uses columns, keeping for alternative)
bind=SUPER,Tab,focusstack,next

bind=SUPER,grave,view,-1,0

# tag switch (niri aligned: SUPER+1-9 view, SUPER+Ctrl+1-9 add, SUPER+Shift+1-9 exclusive)
bind=SUPER,1,toggleview,1,0
bind=SUPER,2,toggleview,2,0
bind=SUPER,3,toggleview,3,0
bind=SUPER,4,toggleview,4,0
bind=SUPER,5,toggleview,5,0
bind=SUPER,6,toggleview,6,0
bind=SUPER,7,toggleview,7,0
bind=SUPER,8,toggleview,8,0
bind=SUPER,9,toggleview,9,0

bind=SUPER+CTRL,1,toggletag,1,0
bind=SUPER+CTRL,2,toggletag,2,0
bind=SUPER+CTRL,3,toggletag,3,0
bind=SUPER+CTRL,4,toggletag,4,0
bind=SUPER+CTRL,5,toggletag,5,0
bind=SUPER+CTRL,6,toggletag,6,0
bind=SUPER+CTRL,7,toggletag,7,0
bind=SUPER+CTRL,8,toggletag,8,0
bind=SUPER+CTRL,9,toggletag,9,0

# tag: move client to tag (alternative)
bind=Alt,1,view,1,0
bind=Alt,2,view,2,0
bind=Alt,3,view,3,0
bind=Alt,4,view,4,0
bind=Alt,5,view,5,0
bind=Alt,6,view,6,0
bind=Alt,7,view,7,0
bind=Alt,8,view,8,0
bind=Alt,9,view,9,0

# monitor switch
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right

# gaps
#bind=ALT+SHIFT,X,incgaps,1
#bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# movewin
# bind=SUPER+Shift,j,movewin,+0,-50
# bind=SUPER+Shift,semicolon,movewin,+0,+50
# bind=SUPER+Shift,k,movewin,-50,+0
# bind=SUPER+Shift,l,movewin,+50,+0
bind=SUPER+CTRL,j,exchange_client,left
bind=SUPER+CTRL,semicolon,exchange_client,right
bind=SUPER+CTRL,k,exchange_client,down
bind=SUPER+CTRL,l,exchange_client,up

# vim-style focus (niri: Mod+H/J/K/L)
bind=SUPER,j,focusdir,left
bind=SUPER,semicolon,focusdir,right
bind=SUPER,k,focusdir,down
bind=SUPER,l,focusdir,up

# resizewin
bind=SUPER+ALT,k,resizewin,+0,-50
bind=SUPER+ALT,l,resizewin,+0,+50
bind=SUPER+ALT,j,resizewin,-50,+0
bind=SUPER+ALT,semicolon,resizewin,+50,+0

# Mouse Button Bindings
# NONE mode key only work in ov mode
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# gesturebind=MODIFIERS,DIRECTION,FINGERS,COMMAND,PARAMETERS

# 3-finger: Window focus
gesturebind=none,left,3,focusdir,right
gesturebind=none,right,3,focusdir,left
gesturebind=none,up,3,focusdir,down
gesturebind=none,down,3,focusdir,up

# 4-finger: Workspace navigation
gesturebind=none,left,4,viewtoright_have_client
gesturebind=none,right,4,viewtoleft_have_client
gesturebind=none,up,4,toggleoverview
gesturebind=none,down,4,toggleoverview

# layer rule
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi

source=./dms/cursor.conf
source=./dms/outputs.conf
